[project]
name = "vbench"
version = "0.1.0"
description = "Energy, latency and memory measurement for video-model fine-tuning and inference on consumer GPUs"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "bitsandbytes>=0.50.2",
    "hiera-transformer>=0.1.4",
    "numpy>=2.5.4",
    "nvidia-ml-py>=13.615.71",
    "peft>=0.21.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
]

[dependency-groups]
data = [
    "scipy>=1.18.1",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vbench"]
